name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # ---------------------------------------------------------------------------
  # The two §9.12 criteria that gate the build rather than a review.
  # Deliberately first and dependency-free: they need no restore, so a token or
  # accessibility regression fails in seconds instead of after a full build.
  # ---------------------------------------------------------------------------
  design-system-gates:
    name: Design system gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # P0-17 / §9.13 item 2
      - name: No hex colour literals outside Themes/Colors.xaml
        shell: pwsh
        run: ./build/Test-NoHexLiterals.ps1

      # A11Y-3 / §9.9
      - name: Icon-only controls carry an automation name and a tooltip
        shell: pwsh
        run: ./build/Test-IconOnlyButtons.ps1

      # §9.4 / A11Y-8. Light and Dark get exercised whenever anyone runs the app;
      # HighContrast does not, because testing it means switching the whole
      # desktop over. A token missing from one theme fails only for the user who
      # needs that theme, so it is checked here instead.
      - name: Theme dictionaries define the same tokens in all three themes
        shell: pwsh
        run: ./build/Test-ThemeDictionaryParity.ps1

      # A11Y-8 / §9.2. Added 27 Aug 2026 (#218), the first defect found by actually
      # switching the desktop into high contrast. The gate above passed it: the two
      # tokens existed, in every theme, with the right type - and were defined as the
      # surface they are painted on, so a tracked satellite at C/N 26-34 was drawn in
      # the page background while its legend still showed a filled dot. Key parity is
      # not legibility, and this is the half the other gate cannot see.
      - name: No HighContrast token is defined as the surface it is drawn on
        shell: pwsh
        run: ./build/Test-HighContrastLegibility.ps1

      # A11Y-12 / §9.4.3. Added 27 Aug 2026 (#32). §10.3's footer staleness had three
      # states whose only difference was FooterText.Foreground: the age in words was in
      # the text either way, but the judgement about that age - fresh, getting old, too
      # old - was hue and nothing else. §9.4.3 notes caution and critical converge under
      # protanopia and deuteranopia, and under high contrast it is not convergence but
      # identity, both being SystemColorWindowTextColor. Two of three states rendered
      # the same pixels.
      - name: No visual state group distinguishes its states by colour alone
        shell: pwsh
        run: ./build/Test-NoColourOnlyStates.ps1

      # §9.13 item 4. Added 15 Aug 2026 after the §15 step 11 anti-pattern audit
      # found nine off-scale values across four pages, every one of which had
      # passed review - an off-by-two margin is invisible one at a time, which is
      # how a spacing scale quietly stops being one.
      - name: Spacing values are on the §9.6 scale and radii are §9.3 ones
        shell: pwsh
        run: ./build/Test-SpacingScale.ps1

      # A11Y-4 / §9.4.5. Added 21 Aug 2026 (#24), which had claimed to gate CI since
      # the backlog was written while nothing in the repository computed a contrast
      # ratio. It found tertiary text at 3.28:1 against a 4.5:1 floor in Light, in
      # 117 places (#176), and two chart series below the 3:1 line (#177) - none of
      # which review had caught in three months, because contrast is not something
      # anyone eyeballs correctly.
      #
      # Needs build/fluent-stock-colours.txt: §9.4.1 maps the text and surface tokens
      # onto stock Fluent colours, which are not readable from source, so they were
      # measured from the running app and recorded. HighContrast is not checked and
      # cannot be - those tokens are the user's own SystemColor* choices.
      - name: Text and graphics meet the §9.4.5 contrast floors
        shell: pwsh
        run: ./build/Test-ContrastFloor.ps1

      # §9.4.4 / A11Y-12. Added 22 Aug 2026 (#87, #177). §9.4.4 said the categorical
      # palette was derived from Okabe-Ito, which separates every pair under the
      # common dichromacies; three of its eight entries had since been substituted
      # for values that read better as thin lines, and the substitution silently
      # gave up exactly that property. Series 1 and 7 sat 4.5 dE00 apart under
      # deuteranopia - one colour - and survived three months of review, because
      # nobody can eyeball a dichromat simulation.
      #
      # Checks all 28 pairs in both themes under normal vision, deuteranopia and
      # protanopia, plus two rules the derivation learned the hard way: a minimum
      # hue gap, because two browns separated by lightness satisfy the arithmetic
      # and fail a person; and clearance from the §9.4.3 severity colours, because
      # "a separate namespace" is a perceptual claim as well as a naming one.
      #
      # HighContrast is not checked and cannot be: its series alternate between two
      # SystemColor* values, so eight traces are not separable by colour there at
      # all. A pass here is not a statement that the chart is accessible.
      - name: Chart series stay distinguishable under dichromacy
        shell: pwsh
        run: ./build/Test-SeriesSeparation.ps1

  # ---------------------------------------------------------------------------
  # P0-7 / §8.4. Separate from the design-system gates because it guards a
  # different thing: that no excluded command is named anywhere but the single
  # file holding the exclusion patterns. Also dependency-free, so it answers in
  # seconds and runs alongside them rather than after a build.
  # ---------------------------------------------------------------------------
  safety-gates:
    name: Safety gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: No excluded command is named outside the exclusion patterns
        shell: pwsh
        run: ./build/Test-NoBlockedCommands.ps1

  # ---------------------------------------------------------------------------
  # The capture harness is used once per hardware outing, and the states it
  # exists to catch happen only while the receiver is being moved (#4, #185).
  # A parsing bug found afterwards cannot be retried without moving it again,
  # so the half that needs no serial port is checked on every push instead of
  # on the day. It is a pwsh script over one committed fixture: no build, no
  # restore, under a second.
  # ---------------------------------------------------------------------------
  tooling:
    name: Tooling self-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The fixture capture harness still parses a status screen
        shell: pwsh
        run: ./build/Capture-Fixtures.ps1 -SelfTest

  # ---------------------------------------------------------------------------
  # §6.1 as amended 15 Aug 2026 requires x64 only, and forbids AnyCPU. ARM64 was
  # dropped because WACK cannot cross-test and there is no ARM64 hardware to
  # certify a submission on; Windows 11 on ARM runs the x64 package under
  # emulation. The matrix keeps its shape so restoring the row is one word.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.configuration }} | ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Restore is per-platform: the RID differs, so the assets file does too.
      - name: Restore
        run: dotnet restore WinZ3805A.sln -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

      # NOTE: CI uses `dotnet build`, while CLAUDE.md tells contributors to prefer
      # MSBuild locally. That is deliberate rather than inconsistent. The .NET 10
      # SDK ships its own MSBuild, whereas the Visual Studio MSBuild on the hosted
      # runner is an older major version that cannot load net10.0 projects. The
      # tradeoff is that a malformed .xaml may fail here without naming the file -
      # which is exactly why the local guidance points at MSBuild. If a XAML build
      # failure here is not self-explanatory, reproduce it locally with MSBuild.
      #
      # TreatWarningsAsErrors and EnforceCodeStyleInBuild are set in
      # Directory.Build.props, so this step is the zero-warnings gate as well.
      - name: Build
        run: dotnet build WinZ3805A.sln --no-restore -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

  # ---------------------------------------------------------------------------
  # The Device library and the parser are UI-independent by design (§6.2, §11.1),
  # so they test headlessly on the runner with no packaged app involved.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/WinZ3805A.Tests/WinZ3805A.Tests.csproj

      - name: Test
        run: dotnet test tests/WinZ3805A.Tests/WinZ3805A.Tests.csproj --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory ${{ runner.temp }}/testresults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/testresults
          if-no-files-found: ignore
